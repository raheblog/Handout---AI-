<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streamlit Cheat Sheet | جزوه استریم‌لیت</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#64708a;--bd:#e3e6ef;--ac:#ff4b4b;--ac2:#7c5cff;--code:#f0f2f8;--cx:#b3265a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--card:#171b26;--tx:#e8ebf4;--mut:#93a0bc;--bd:#272e3f;--code:#0b0e15;--cx:#ff9ec1}}
:root[data-theme="dark"]{--bg:#0e1117;--card:#171b26;--tx:#e8ebf4;--mut:#93a0bc;--bd:#272e3f;--code:#0b0e15;--cx:#ff9ec1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;line-height:1.7;transition:background .25s,color .25s}
header{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:28px 20px 70px;text-align:center}
header h1{margin:0 0 6px;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800}
header p{margin:0;opacity:.92}
.tools{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.tools button{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:6px 16px;cursor:pointer;font:inherit;font-weight:600}
.tools button:hover{background:rgba(255,255,255,.32)}
main{max-width:1180px;margin:-44px auto 40px;padding:0 16px}
.bar{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.tab{flex:1;min-width:110px;border:0;background:transparent;color:var(--mut);padding:10px;border-radius:10px;cursor:pointer;font:inherit;font-weight:700}
.tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.bar input{flex:2;min-width:160px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;overflow:hidden}
.card h2{margin:0 0 10px;font-size:1.05rem;color:var(--ac);border-bottom:2px dashed var(--bd);padding-bottom:6px}
.row{margin:10px 0}
pre{direction:ltr;text-align:left;margin:0;background:var(--code);border-radius:8px;padding:7px 10px;font:600 .8rem 'JetBrains Mono',Consolas,monospace;color:var(--cx);overflow-x:auto;cursor:pointer;white-space:pre;border:1px solid transparent}
pre:hover{border-color:var(--ac2)}
.row small{display:block;color:var(--mut);font-size:.85rem;margin-top:2px}
.none{text-align:center;color:var(--mut);padding:40px}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding-bottom:30px}
</style>
</head>
<body>
<header>
<h1 id="t"></h1><p id="s"></p>
<div class="tools"><button id="th"></button><button id="lg"></button></div>
</header>
<main>
<div class="bar" id="bar"></div>
<div class="grid" id="g"></div>
</main>
<footer id="f"></footer>
<script>
const D={
basic:[
["Setup &amp; Run|نصب و اجرا",["pip install streamlit|Install|نصب کتابخانه","import streamlit as st|Import (standard alias)|ایمپورت با نام st","streamlit run app.py|Run the app|اجرای برنامه","streamlit hello|Demo app|برنامه نمایشی"]],
["Text|متن",["st.title('Title')|Page title|عنوان صفحه","st.header('H')  st.subheader('S')|Headings|سرتیترها","st.write('text', df)|Smart output of anything|نمایش هوشمند هر چیز","st.markdown('**bold**')|Markdown|مارک‌داون","st.caption('small')|Small caption|توضیح کوچک","st.code('x=1', language='python')|Code block|بلوک کد","st.latex(r'e^{i\\pi}+1=0')|Math formula|فرمول ریاضی","st.divider()|Horizontal line|خط جداکننده"]],
["Input widgets|ویجت‌های ورودی",["st.button('Go')|Button, returns True on click|دکمه","st.checkbox('ok')  st.toggle('on')|Checkbox / toggle|چک‌باکس و سوییچ","st.radio('Pick', ['a','b'])|Radio buttons|گزینه تکی","st.selectbox('Pick', opts)|Dropdown|لیست کشویی","st.multiselect('Pick', opts)|Multiple choice|انتخاب چندتایی","st.slider('n', 0, 100, 50)|Slider|اسلایدر","st.text_input('Name')|One-line text|متن تک‌خطی","st.text_area('Bio')|Multi-line text|متن چندخطی","st.number_input('n')|Number field|ورودی عدد","st.date_input('d')  st.time_input('t')|Date / time|تاریخ و ساعت","st.file_uploader('CSV')|Upload file|آپلود فایل","st.color_picker('c')|Color picker|انتخاب رنگ"]],
["Data display|نمایش داده",["st.dataframe(df)|Interactive table|جدول تعاملی","st.table(df)|Static table|جدول ثابت","st.metric('Temp', '20°', '+1')|KPI number with delta|شاخص عددی","st.json(obj)|Pretty JSON|نمایش JSON"]],
["Basic charts|نمودارهای ساده",["st.line_chart(df)|Line chart|نمودار خطی","st.bar_chart(df)|Bar chart|نمودار میله‌ای","st.area_chart(df)|Area chart|نمودار ناحیه‌ای","st.scatter_chart(df)|Scatter|نمودار پراکندگی","st.map(df)|Map (lat, lon columns)|نقشه","st.pyplot(fig)|Matplotlib figure|نمودار matplotlib"]],
["Layout|چیدمان",["st.sidebar.title('Menu')|Sidebar|نوار کناری","c1, c2 = st.columns(2)|Columns|ستون‌ها","t1, t2 = st.tabs(['A','B'])|Tabs|تب‌ها","with st.expander('More'):|Collapsible box|بخش جمع‌شونده","with st.container(border=True):|Group elements|گروه‌بندی عناصر"]],
["Status &amp; feedback|وضعیت و بازخورد",["st.success('ok')  st.info('i')|Colored messages|پیام رنگی","st.warning('w')  st.error('e')|Warning / error|هشدار و خطا","with st.spinner('Wait'):|Loading spinner|چرخان انتظار","st.progress(0.5)|Progress bar|نوار پیشرفت","st.toast('Saved')|Toast popup|پیام کوتاه","st.balloons()  st.snow()|Celebration|جشن!"]],
["Media|رسانه",["st.image('a.png', width=300)|Image|تصویر","st.audio('a.mp3')|Audio|صدا","st.video('v.mp4')|Video|ویدیو"]]
],
mid:[
["Session state|حافظه نشست",["if 'n' not in st.session_state:\n    st.session_state.n = 0|Init a variable|مقداردهی اولیه","st.session_state.n += 1|Persist across reruns|ماندگاری بین اجراها","st.text_input('x', key='name')|Bind widget to state|اتصال ویجت به state"]],
["Caching|کش",["@st.cache_data(ttl=600)|Cache data results|کش داده‌ها","@st.cache_resource|Cache models/connections|کش منابع سنگین","st.cache_data.clear()|Clear cache|پاک کردن کش"]],
["Forms|فرم‌ها",["with st.form('f'):\n    n = st.text_input('n')\n    ok = st.form_submit_button('Send')|Batch inputs, one rerun|ارسال یکجا بدون رفرش مکرر"]],
["Callbacks|کالبک‌ها",["st.button('+', on_click=inc, args=(1,))|Run function on click|اجرای تابع هنگام کلیک","st.selectbox('x', o, on_change=fn)|Run on change|اجرا هنگام تغییر"]],
["Editable data|داده قابل ویرایش",["edited = st.data_editor(df, num_rows='dynamic')|Editable table|جدول ویرایش‌پذیر","column_config={'p': st.column_config.NumberColumn('Price')}|Column settings|تنظیم ستون‌ها"]],
["Multipage apps|برنامه چندصفحه‌ای",["pg = st.navigation([st.Page('a.py', title='A'), st.Page('b.py')])\npg.run()|Define pages|تعریف صفحه‌ها","st.switch_page('b.py')|Jump to page|رفتن به صفحه","st.page_link('b.py', label='Go')|Link to page|لینک به صفحه"]],
["Chat UI|رابط چت",["with st.chat_message('user'):\n    st.write('Hi')|Chat bubble|حباب چت","prompt = st.chat_input('Say...')|Chat box|ورودی چت","st.write_stream(generator)|Stream text|نمایش جریانی متن"]],
["Files &amp; I/O|فایل و ورودی/خروجی",["st.download_button('Get', data, 'f.csv')|Download|دانلود فایل","st.camera_input('Photo')|Camera|دوربین","st.audio_input('Rec')|Record audio|ضبط صدا"]],
["Config &amp; secrets|پیکربندی و رازها",["st.set_page_config(page_title='App', layout='wide')|Must be first st call|اولین دستور st","st.secrets['key']|From .streamlit/secrets.toml|خواندن از secrets.toml","st.query_params['id']|URL parameters|پارامترهای URL"]],
["Rich charts|نمودار پیشرفته",["st.plotly_chart(fig)|Plotly|پلاتلی","st.altair_chart(chart)|Altair|آلتیر","st.pydeck_chart(deck)|3D maps|نقشه سه‌بعدی"]]
],
adv:[
["Fragments|فرگمنت‌ها",["@st.fragment(run_every='5s')\ndef live(): ...|Rerun part of the page only|بازاجرای بخشی از صفحه","st.rerun(scope='fragment')|Rerun fragment|ریران فرگمنت"]],
["Dialogs &amp; popovers|دیالوگ و پاپ‌اور",["@st.dialog('Edit')\ndef d(): ...|Modal dialog|پنجره مودال","with st.popover('Opts'):|Popover menu|منوی شناور"]],
["Execution control|کنترل اجرا",["st.rerun()|Force rerun|اجرای مجدد","st.stop()|Halt script|توقف اسکریپت","ph = st.empty()\nph.write('x')|Replaceable placeholder|جایگاه قابل جایگزینی"]],
["Connections|اتصال به داده",["conn = st.connection('db', type='sql')|SQL connection|اتصال SQL","df = conn.query('SELECT 1', ttl=60)|Cached query|کوئری کش‌شده"]],
["Auth|احراز هویت",["st.login('google')|OIDC login|ورود OIDC","st.user.is_logged_in|User info|اطلاعات کاربر","st.logout()|Sign out|خروج"]],
["Custom components|کامپوننت سفارشی",["st.html('&lt;b&gt;hi&lt;/b&gt;')|Raw HTML|HTML خام","components.html(html, height=300)|Embed iframe/JS|جاسازی HTML و JS","components.declare_component('x', path)|Own React/JS component|ساخت کامپوننت اختصاصی"]],
["Theme &amp; config.toml|تم و کانفیگ",["[theme]\nprimaryColor = '#ff4b4b'|.streamlit/config.toml|فایل تنظیمات تم","[server]\nport = 8080|Server settings|تنظیمات سرور","st.context.headers|Request headers|هدرهای درخواست"]],
["Performance|بهینه‌سازی",["@st.cache_data(hash_funcs={Foo: id})|Custom hashing|هش سفارشی","st.cache_resource(show_spinner=False)|Silent cache|کش بی‌صدا","st.set_page_config(layout='wide')|Use full width|عرض کامل"]],
["Testing|تست",["from streamlit.testing.v1 import AppTest\nat = AppTest.from_file('app.py').run()|Headless test|تست بدون مرورگر","at.button[0].click().run()|Simulate click|شبیه‌سازی کلیک"]],
["Deploy|استقرار",["streamlit run app.py --server.port 8501|Port|تعیین پورت","FROM python:3.12\nCMD streamlit run app.py|Docker|داکر","share.streamlit.io|Community Cloud (free)|استقرار رایگان ابری"]]
]};
const T={en:{t:"Streamlit Cheat Sheet",s:"The st module: basic to advanced. Click any code to copy it.",basic:"🟢 Basic",mid:"🟡 Intermediate",adv:"🔴 Advanced",q:"Search...",none:"No results",f:"Built for quick reference",day:"☀️ Day",night:"🌙 Night",lang:"فارسی"},
fa:{t:"جزوه استریم‌لیت (Streamlit)",s:"ماژول st از مقدماتی تا حرفه‌ای. روی هر کد کلیک کنید تا کپی شود.",basic:"🟢 عمومی",mid:"🟡 متوسط",adv:"🔴 حرفه‌ای",q:"جستجو...",none:"نتیجه‌ای پیدا نشد",f:"برای مرور سریع",day:"☀️ روز",night:"🌙 شب",lang:"English"}};
let lang="fa",lvl="basic",q="",R=document.documentElement;
try{lang=localStorage.getItem("sl")||"fa";const th=localStorage.getItem("st");if(th)R.dataset.theme=th}catch(e){}
const dark=()=>R.dataset.theme?R.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
const $=i=>document.getElementById(i);
function render(){
const L=T[lang],i=lang==="fa"?1:0;
R.lang=lang;R.dir=lang==="fa"?"rtl":"ltr";document.title=L.t;
$("t").textContent=L.t;$("s").textContent=L.s;$("f").textContent=L.f;
$("th").textContent=dark()?L.day:L.night;$("lg").textContent=L.lang;
$("bar").innerHTML=["basic","mid","adv"].map(k=>`<button class="tab ${k===lvl?"on":""}" data-k="${k}">${L[k]}</button>`).join("")+`<input id="q" placeholder="${L.q}" value="${q.replace(/"/g,"&quot;")}">`;
let h="";
D[lvl].forEach(([ti,rows])=>{
const rs=rows.map(r=>{const p=r.split("|");return{c:p[0],d:p[1+i]}}).filter(r=>!q||(r.c+r.d).toLowerCase().includes(q.toLowerCase()));
if(!rs.length)return;
h+=`<section class="card"><h2>${ti.split("|")[i]}</h2>`+rs.map(r=>`<div class="row"><pre title="copy">${r.c.replace(/&(?!amp;|lt;|gt;)/g,"&amp;").replace(/</g,"&lt;")}</pre><small>${r.d}</small></div>`).join("")+"</section>"});
$("g").innerHTML=h||`<div class="none">${L.none}</div>`;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{lvl=b.dataset.k;render()});
const qi=$("q");qi.oninput=e=>{q=e.target.value;const p=qi.selectionStart;render();const n=$("q");n.focus();n.setSelectionRange(p,p)};
document.querySelectorAll("pre").forEach(p=>p.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(p.textContent).catch(()=>{});p.style.outline="2px solid #2ea44f";setTimeout(()=>p.style.outline="",600)});
}
$("th").onclick=()=>{R.dataset.theme=dark()?"light":"dark";try{localStorage.setItem("st",R.dataset.theme)}catch(e){}render()};
$("lg").onclick=()=>{lang=lang==="fa"?"en":"fa";try{localStorage.setItem("sl",lang)}catch(e){}render()};
render();
</script>
</body>
</html>
